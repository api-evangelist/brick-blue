source: >-
  openapi/brick-blue-openapi.yml (live from https://brick.blue/openapi.json), a2a/brick-blue-agent-card.json
  (live card), mcp/brick-blue-mcp-tools.json + brick-blue-mcp-initialize.json (live MCP handshake),
