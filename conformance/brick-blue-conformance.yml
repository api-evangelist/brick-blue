domain_standards_note: >-
  The rows marked domain_standard: true are the ones a buyer in this market integrates against
  without a bespoke connector: an agent that already speaks A2A, MCP, x402 and RFC 9421 arrives
  with no adapter. Each row's evidence names the exact contract location (securitySchemes.httpsig,
  the 402 on postModelsChat, getAgentsByIdAttestations, getNetworks) rather than a marketing claim.
