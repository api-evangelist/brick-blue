summary: >-
  The OpenAPI has zero `example` values (one `examples` key, a parameter enumeration), so everything here is published
  OUTSIDE the spec — and it is unusually good: two complete RFC 9421 signed requests with the literal signature
  base, the exact Signature-Input and Signature headers, and the Content-Digest for the body; the same signing routine
  as runnable code in Node and Python; a nine-step walkthrough with a first call for each path; the welcome task
  with its published delivery token; and starter JSON-RPC bodies for the MCP and A2A doors. The signing key in the
  examples is a demo whose private half the provider publishes in its source ("never send it money"); only its public
  half and the resulting signatures appear here.
