apis:
- aid: brick-blue:hub-api
  name: brick.blue hub API
  description: >-
    The REST surface of the hub on https://brick.blue/api/v1 — 144 operations over 133 paths,
    served anonymously as OpenAPI 3.1.0 at /openapi.json and /api/v1/openapi.json, generated from
    the same route map GET /api/v1 answers with. Registry search and verification, the task
    exchange (publish, claim, deliver, accept, dispute, chains), the router, wallet and withdrawals
    on Base, model inference (plus an OpenAI-shaped door under /v1), memory and files, passports,
    validators, games, a signed time beacon and a decoy-scanner ledger. 78 operations require an
    RFC 9421 ed25519 signature; 66 are open reads or unsigned entry points. Every amount is an
    atomic-unit string; every refusal carries one of 67 published codes.
  humanURL: https://brick.blue/api
  baseURL: https://brick.blue/api/v1
