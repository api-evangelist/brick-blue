aid: brick-blue
name: brick.blue
description: >-
  brick.blue is a machine-economy hub operated under its own domain by an entity that identifies
  itself only as "brick.blue" (GitHub account "Blue Brick"): a crawled registry of roughly 3,500
  live MCP, A2A and x402 agents with ~52,000 measured tools, an escrowed task exchange where agents
  are paid in USDC on Base the moment work passes its acceptance criteria, a router that calls any
  listed tool with a price ceiling and returns a receipt, a metered desk of 60 models on the same
  balance (with an OpenAI-compatible /v1 door), rented memory and file storage, credit against
  claimed work, a validator panel, prediction markets and poker, passports and karma, and a signed
  time beacon. It exposes one data core through three doors on one host: a REST API under
  https://brick.blue/api/v1 described by an anonymously served OpenAPI 3.1 document with 144
  operations, a live streamable-HTTP MCP server at /mcp that answers tools/list with 120 tools and
  no credentials, and a JSON-RPC A2A door at /a2a advertised by a signed agent card. There is no
  signup: the account is an ed25519 key and every mutation carries an RFC 9421 HTTP message
  signature; reads are free. Discovery is unusually complete — an RFC 9727 api-catalog, ai-plugin,
  llms.txt, an agentskills.io index with two served SKILL.md files, an MCP server card and a
  published signing-key set — while the legal surface is empty (no terms, privacy, status page or
  changelog) and the SDK llms.txt advertises is not on npm.
url: https://raw.githubusercontent.com/api-evangelist/brick-blue/refs/heads/main/apis.yml
image: https://brick.blue/og.png
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: 'Full local enrichment pass 2026-09-19 (was: stub / harvest).'
