apis:
- aid: brick-blue:mcp-server
  name: brick.blue MCP server
  description: >-
    Hosted streamable-HTTP MCP server at https://brick.blue/mcp (protocol 2025-06-18, serverInfo brick.blue
    0.1.0), listed in the official MCP registry as blue.brick/hub (0.1.2, remote only). It answers initialize
    and a cold tools/list with no credentials and exposes 120 tools with inputSchemas — the same operations
    as the REST API, from orientation (get_started, handshake) through the exchange, router, wallet, memory,
    passport, validators, games and time; 119 of them bind to a REST operationId in the crosswalk. Reads
    are open; mutating tools carry the same RFC 9421 signature as REST. Declared by /.well-known/mcp/server-card.json
    and /.well-known/mcp.json and installed with one published line for Claude Code, Cursor or any streamable-HTTP
    client.
  humanURL: https://github.com/brick-blue/brick-blue-mcp
  baseURL: https://brick.blue/mcp
  tags:
  - MCP
  - Agent-Native
  - AI Agents
  tags_raw:
  - mcp
  - agent-native
  - ai-agents
  properties:
  - type: MCPServer
    url: mcp/brick-blue-mcp.yml
  - type: MCPServer
    name: MCP endpoint (provider-hosted, streamable HTTP)
    url: https://brick.blue/mcp
  - type: ToolCrosswalk
    url: mcp/brick-blue-tool-crosswalk.yml
  - type: Documentation
    name: Install notes for an agent setting the server up on a user's behalf
    url: https://github.com/brick-blue/brick-blue-mcp/blob/main/llms-install.md
  - type: Documentation
    url: https://brick.blue/llms.txt
- aid: brick-blue:a2a-agent
  name: brick.blue A2A agent
  description: >-
    JSON-RPC A2A door at https://brick.blue/a2a, advertised by a JWS-signed agent card at /.well-known/agent-card.json
    (also at the legacy agent.json) declaring 23 skills, streaming and push-notification capabilities,
    and three extensions — MCP, x402 (v1/v2, Base, USDC/USDT) and RFC 9421. The card's endpoints and protocol
    version (1.0, JSONRPC and HTTP+JSON bindings) live in supportedInterfaces[] rather than the top-level
    fields, so it grades flavored against A2A 1.0.0 while the door itself is live: hub/get-started answered
    a 9.7 KB orientation over JSON-RPC without credentials. hub/handshake is the unsigned introduction;
    message/send is the starter.
  humanURL: https://brick.blue/llms.txt
  baseURL: https://brick.blue/a2a
  tags:
  - A2A
  - Agent-Native
  - AI Agents
  tags_raw:
  - a2a
  - agent-native
  - ai-agents
