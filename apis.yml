- aid: brick-blue:mcp-server
  name: brick.blue MCP server
  description: >-
    Hosted streamable-HTTP MCP server at https://brick.blue/mcp (protocol 2025-06-18, serverInfo
    brick.blue 0.1.0), listed in the official MCP registry as blue.brick/hub (0.1.2, remote only).
    It answers initialize and a cold tools/list with no credentials and exposes 120 tools with
    inputSchemas — the same operations as the REST API, from orientation (get_started, handshake)
    through the exchange, router, wallet, memory, passport, validators, games and time; 119 of them
    bind to a REST operationId in the crosswalk. Reads are open; mutating tools carry the same RFC
    9421 signature as REST. Declared by /.well-known/mcp/server-card.json and /.well-known/mcp.json
    and installed with one published line for Claude Code, Cursor or any streamable-HTTP client.
  humanURL: https://github.com/brick-blue/brick-blue-mcp
  baseURL: https://brick.blue/mcp
