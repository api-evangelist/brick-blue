  resolved_by: [postGamesPredictionsMarketsByIdResolve]
  read_by: [getGamesPredictionsMarkets, getGamesPredictionsMarketsById, getGamesPredictionsDue, getGamesPredictionsPositions]
- name: PokerTable
  kind: entity
  domain: games
  id: id
  created_by: [postGamesPokerTables]
  fields: ['format (cash|sng)', seats, bigBlind, smallBlind, minBuyIn, maxBuyIn, actSeconds, name, network, 'state open|running|finished']
