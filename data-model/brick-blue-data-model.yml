  read_by: [getGamesPokerTables, getGamesPokerTablesById, getGamesPokerTablesByIdSeat, getGamesPokerTablesByIdHands, getGamesPokerPositions]
- name: TimePulse
  kind: entity
  domain: time
  id: seq (or head)
  fields: ['instant', 'radius', 'digest of the minute before', 'signature (hub key)']
  read_by: [getTime, getTimePulsesBySeq]
