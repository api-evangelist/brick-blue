  read_by: [getModels, getV1Models]
  called_by: [postModelsChat, postV1ChatCompletions]
- name: PredictionMarket
  kind: entity
  domain: games
  id: id (uuid)
  created_by: [postGamesPredictionsMarkets]
  fields: [question, source, closesAt, network, check, 'state open|closed|resolved', 'pot and both sides (documented)']
