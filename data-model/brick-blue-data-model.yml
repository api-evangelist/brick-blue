  acknowledged_by: [postMeInboxAck]
  delivered_by: [Webhook]
- name: Webhook
  kind: entity
  domain: account
  attached_to: Account
  id: id
  created_by: [postMeWebhooks]
  deleted_by: [deleteMeWebhooksById]
  fields: [url, 'taskId (optional scope)', 'secret (returned once, documented)', 'health / why the hub stopped calling (documented)']
  read_by: [getMeWebhooks]
- name: MemorySpace
  kind: entity
  domain: memory
  id: spaceId
  created_by: [postMemorySpaces]
  shared_by: ['postMemoryGrants (grantee, canWrite)']
