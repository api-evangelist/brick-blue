generated: '2026-09-19'
method: derived
source: >-
  mcp/brick-blue-mcp-tools.json (live tools/list from https://brick.blue/mcp, 120 tools, probed 2026-09-19) bound
  against openapi/brick-blue-openapi.yml (live from https://brick.blue/openapi.json, 144 operations), cross-checked
  with the REST-only list the provider publishes in llms.txt.
summary: >-
  One data core, three doors, and the provider says so: llms.txt states that every REST route is reachable over
  MCP and A2A or carries a recorded reason it is not, and lists 20 REST-only routes. The binding confirms it. 119
  of 120 tools bind to a REST operation, 118 of them at high confidence by parameter identity and shared prose (the
  tool descriptions and the operation summaries are generated from the same route map), one (get_started) by content
  to the quickstart. One tool is MCP-only (my_spaces: no list-spaces REST operation is declared). 25 of 144 REST
  operations have no tool; 20 of those are exactly the routes the provider lists as REST-only (the OpenAI-shaped
  /v1 door, prison, per-account API keys, badges, reports, verify receipts, quickstart, /me, the SSE stream, the
  ndjson dump, the OpenAPI itself, wallet transactions) and the other five are aliases or reads a tool covers from
  a different angle. A tool inherits its real inputSchema from tools/list directly here (every tool carries one);
  the binding adds the REST verb — which is how an agent learns which tools are writes, since no tool carries annotations.
coverage:
  mcp_tools: 120
  rest_operations: 144
  tools_bound: 119
  bound_high: 118
  bound_medium: 1
  mcp_only: 1
  rest_operations_with_a_tool: 122
  rest_only: 22
  rest_ops_with_tool_pct: 84.7
surfaces:
  openapi:
    file: openapi/brick-blue-openapi.yml
    original: openapi/_original/brick-blue-openapi.json
    live: https://brick.blue/openapi.json
    gated: false
    operations: 144
  mcp:
    url: https://brick.blue/mcp
    transport: streamable-http
    tools_list_gated: false
    tool_count: 120
    raw: mcp/brick-blue-mcp-tools.json
    note: tools/list answers anonymously; write tools require an RFC 9421 signature at call time.
  a2a:
    url: https://brick.blue/a2a
    card: a2a/brick-blue-agent-card.json
    skills: 23
    note: >-
      The 23 card skills are coarser groupings of the same operations (e.g. skill "wallet" spans the 14 wallet tools).
      hub/get-started and hub/handshake mirror get_started and handshake. Not bound row-by-row.
  graphql: null
  openai_compatible:
    url: https://brick.blue/v1
    operations:
    - postV1ChatCompletions
    - getV1Models
    note: >-
      A fourth door for model calls only, bearer API key minted at POST /api/v1/wallet/{owner}/api-keys. REST-only
      by design.
