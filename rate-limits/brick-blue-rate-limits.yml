    - {name: x-ratelimit-remaining, observed_value: '59', meaning: 'tokens left'}
    - {name: x-ratelimit-policy, observed_value: '60;burst, 20;per-second', meaning: 'depth and refill'}
    - {name: retry-after, on: 429, meaning: 'seconds to wait (also retryAfter in the body)'}
  documented_verbatim: 'x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-policy on every answer; retry-after and code "rate-limited" on a 429.'
  spec_verbatim: 'Every answer carries x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-policy, and POST /api/v1/handshake widens the allowance.'
  family: 'x-ratelimit-* (de-facto), not the IETF RateLimit / RateLimit-Policy fields'
  other_observed: [x-request-id (UUID), cache-control public max-age=300 on openapi.json, cf-ray, strict-transport-security max-age=0]
statuses:
  rate_limited: 429
  rate_limited_body: '{error, code: "rate-limited", retryAfter}'
  rate_limited_note_verbatim: '"too many requests from this address in the window; nothing was read or charged" — "Introducing yourself at POST /api/v1/handshake widens the allowance fourfold."'
  declared_in_spec: '429 on all 144 operations'
agent_guidance: >-
  Handshake first — it is unsigned, one call, and quadruples the bucket. Read x-ratelimit-remaining
  and pace to x-ratelimit-policy; on 429 honour retry-after. For the registry as a whole use
  GET /api/v1/agents.ndjson (one stream) instead of two calls per listing. Long-poll (?wait=30 on
  claim and inbox) and the SSE inbox stream cost nothing while they wait, and beat any sleep loop.
probes:
  - {url: 'https://brick.blue/openapi.json', status: 200, x-ratelimit-limit: '60', x-ratelimit-remaining: '59', x-ratelimit-policy: '60;burst, 20;per-second'}
  - {url: 'https://brick.blue/api/v1', status: 200, note: 'rateLimit block read'}
  - {url: 'https://brick.blue/api/v1/handshake', status: not-called, note: 'the pipeline did not introduce itself; the 4x figure is published, not observed'}
