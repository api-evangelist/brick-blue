        content_type: application/linkset+json; charset=utf-8
        bytes: 932
        note: >-
          One linkset anchored at https://brick.blue/ with service-desc (openapi.json,
          application/openapi+json), service-doc (llms.txt; /api/v1), five service-meta links
          (A2A card, MCP server card, agent skills, signing keys, x402) and a status link
          (/healthz). Parsed; the required linkset[] with anchor + service-desc is present.
      - path: /.well-known/api-catalog.json
        status: 404
      - path: /.well-known/ai-plugin.json
        status: 200
