source: live probes of the named /.well-known/ path list on every brick.blue host, 2026-09-19
checked: '2026-09-19'
summary: >-
  brick.blue publishes an unusually complete discovery surface, all on one host. Of the named
  list, two documents are served — an RFC 9727 api-catalog linkset at /.well-known/api-catalog
  (application/linkset+json, naming the OpenAPI, llms.txt, the A2A card, the MCP server card, the
  agent-skills index, the signing keys, the x402 paywall map and a health URL) and an
  ai-plugin.json (auth none, api type openapi -> https://brick.blue/openapi.json). Beyond the list,
  the linkset led to five more first-party documents, saved here: the MCP server card, the
  agent-skills discovery index (agentskills.io discovery 0.2.0), the ed25519 key set the hub signs
  its answers with, the x402 paywall map, and the MCP discovery document /.well-known/mcp.json that
  llms.txt names. The A2A card is served at both the canonical and legacy paths and is registered
  in a2a/. NOT served: security.txt (RFC 9116), OIDC discovery, RFC 8414 / RFC 9728 OAuth metadata
  (the MCP server is on this same host, so the MCP-host probe is this probe; auth is RFC 9421
  signatures, not OAuth), AAuth, UCP/ACP, and any apis.json / apis.yml index.
pointer_basis: >-
  WellKnown is emitted on the strength of the served api-catalog (the exact document the
  well_known_catalog dimension is about) and ai-plugin.json. SecurityTxt is NOT emitted: no
  security.txt on any host. The agent card is registered separately as AgentCard via
  a2a/brick-blue-a2a.yml; the MCP server as MCPServer via mcp/brick-blue-mcp.yml.
host_set_note: >-
  Seven roles, ONE host. The registrable domain, its www., the REST baseURL host, the OpenAPI
  servers[] host (https://brick.blue), the docs host (llms.txt and /api/v1 are served from the
  apex), the MCP server host (https://brick.blue/mcp) and the A2A host (https://brick.blue/a2a)
  are all brick.blue. api., docs., mcp. and app. subdomains answer Cloudflare 525 (SSL handshake
  failed at origin) — configured in DNS, not serving — and are recorded below so the absence is
  visible. No fetched discovery document names an authorization server on a third host.
hosts:
