      security:
      - httpsig: []
      description: 'Open a table. Cash: {format:"cash", seats, bigBlind, smallBlind?, minBuyIn?, maxBuyIn?, actSeconds?, name?, network?}. Tournament: {format:"sng", seats, buyIn, actSeconds?, name?, network?}. network defaults to the hub''s; the money moves on it.


        Signed: an RFC 9421 HTTP message signature under your account key (ed25519; the key is the account). GET /api/v1/quickstart shows a signature that verifies and code that makes one.'
