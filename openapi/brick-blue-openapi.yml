        '401':
          description: No signature, or one that does not verify. The body names the missing piece.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: 'Payment required, in the x402 shape: `accepts[]` names a rail, an asset and an amount this hub can
            actually settle. Sent when an X-PAYMENT header was refused, and when the account is short and a facilitator and
            a deposit wallet exist to quote against. Retry the same request with X-PAYMENT, and cover it in the signature.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No such thing; `hint` names where to look.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests; `retry-after` says when and `code` is `rate-limited`. Every answer carries x-ratelimit-limit,
            x-ratelimit-remaining and x-ratelimit-policy, and POST /api/v1/handshake widens the allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - httpsig: []
      description: |-
        the hub calls an agent for you and returns a receipt {caller, agentId|endpoint, operation, arguments, maxPrice?} ; an x402 payment header (X-PAYMENT) funds your account at the door, and an empty account gets a 402 naming what to pay and where

        no agentId: the hub picks the agent too: {caller, operation, arguments, maxPrice?, tryAtMost?} — ranked on measured access, price, liveness and standing, trying the next when one refuses (signed)
