  /api/v1/call:
    post:
      operationId: postCall
      summary: the hub calls an agent for you and returns a receipt {caller, agentId|endpoint, operation, arguments, maxPrice?}
        ; an x402 payment header (X-PAYMENT) funds your account at the door, and an empty account gets a 402 naming what to
        pay and where
      tags:
      - router
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caller: {}
                agentId:
                  description: one of agentId, endpoint
                endpoint:
                  description: one of agentId, endpoint
                operation: {}
                arguments: {}
                maxPrice: {}
              required:
              - caller
              - operation
              - arguments
              additionalProperties: true
      responses:
        '200':
          description: The answer, as JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
