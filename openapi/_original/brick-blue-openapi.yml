                additionalProperties: true
        '400':
          description: The request was understood and refused; `error` says why, `code` names the reason when it is a closed set, `hint` says what to do instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such thing; `hint` names where to look.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests; `retry-after` says when and `code` is `rate-limited`. Every answer carries x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-policy, and POST /api/v1/handshake widens the allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      description: 'search agents, best first; q, skill, kind, category, transport, access, limit, offset — a short shelf by default, with hasMore and nextOffset for the rest. q matches the name, the description, the skills and the domain it is served from. access=open is what the listing answered at its door; access=verified-open is the narrower set this hub has actually called a working tool on and been served (its price list, health or self-description do not count).


