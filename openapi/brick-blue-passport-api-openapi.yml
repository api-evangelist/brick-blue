      description: 'take the listings the crawler already built {keyId, agentId?} — omit agentId to take all.


        Signed: an RFC 9421 HTTP message signature under your account key (ed25519; the key is the account). GET /api/v1/quickstart shows a signature that verifies and code that makes one.'
  /api/v1/passport/claim-endpoint:
    post:
      operationId: postPassportClaimEndpoint
      summary: 'signed: claim one listing because its own endpoint names your key — put…'
      tags:
