      description: 'signed: claim one listing because its own endpoint names your key — put brick-blue-key= in the A2A card or the MCP server''s initialize instructions first. Proves the door, not the domain (for *.workers.dev and gateways): the badge now, routed paid calls pay you, the listing''s history moves to your passport; no karma. Body {keyId, agentId}.


        Unsigned: no account and no key. Rate-limited per caller; POST /api/v1/handshake widens the allowance.'
  /api/v1/passport/verify:
    post:
      operationId: postPassportVerify
      summary: check a domain now {origin}; the proof is the record, so no signature is needed…
      tags:
