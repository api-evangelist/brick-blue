          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      description: 'listings on domains this passport proved but has not taken.


        Unsigned: no account and no key. Rate-limited per caller; POST /api/v1/handshake widens the allowance.'
