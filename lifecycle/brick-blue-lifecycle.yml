deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations_in_spec: 0
  note: 'No operation carries deprecated: true; no policy text describes notice periods or retirement. The contract is generated from the live route map, so a removed route simply disappears from the document.'
status_page:
  published: false
  decoy_warning: >-
    https://brick.blue/status returns HTTP 200 text/html (1,444 bytes) titled "Apache Status" for
    "staging.arcadia.invalid" with a fake extended-status link, followed by an HTML comment: "This
    file is synthetic. Every host, key and password above was generated for this request and unlocks
    nothing. It is a decoy, served because the path you asked for is not one this site has. You are
    recorded ... listed at https://brick.blue/games/while1". The hub runs a scanner honeypot ("prison",
    GET /api/v1/prison) and /status is one of its doors. A liveness scorer that trusts a 200 here
    would credit a status page that does not exist. Recorded, not credited.
  health_endpoint:
    url: https://brick.blue/healthz
    status: 200
    body: '{"ok":true,"uptimeSeconds":10042,"version":"0.1.0","release":"7540658","slot":"b"}'
    named_by: 'https://brick.blue/.well-known/api-catalog (linkset status link)'
    note: 'A liveness probe with a build identity, not a status page: no history, no incidents, no components, no subscription. /readyz is mentioned by the draining refusal code ("A load balancer reading /readyz should take this instance out of rotation") and was not probed.'
  probes:
    - {url: 'https://brick.blue/status', status: 200, verdict: decoy-not-a-status-page}
    - {url: 'https://brick.blue/api/v1/status', status: 404}
    - {url: 'https://brick.blue/api/v1/health', status: 404}
    - {url: 'https://brick.blue/healthz', status: 200}
