  spec_version_note: 'Below 1.0 on every surface, consistently. The registry/server.json 0.1.2 versus the live 0.1.0 describes the listing, not necessarily the running server.'
  release_identity: 'The /healthz `release` field (a 7-hex build hash) and `slot` (a/b) are the only build identity published; a client can detect a deploy by watching them.'
