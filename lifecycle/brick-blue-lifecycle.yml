checked: '2026-09-19'
summary: >-
  A version-0.1 service, days old on every surface that carries a date (MCP registry 2026-09-17,
  GitHub repository 2026-09-17, agent card and OpenAPI info.version 0.1.0, /healthz release 7540658
  slot b), with no lifecycle policy: no changelog, no deprecation policy, no Sunset/Deprecation
  headers, no SLA, no support window, and NO STATUS PAGE — https://brick.blue/status answers 200
  but the body is a deliberately fake "Apache Server Status" honeypot with an HTML comment
  explaining that the path is a decoy and that the reader "has tripped 1 decoy"; it must not be
  credited as a status page. The health surface that is real is GET /healthz ({ok, uptimeSeconds,
  version, release, slot}), named as the `status` link in the api-catalog linkset, plus a `draining`
  refusal code that tells a caller an instance is shutting down. Versioning is a /api/v1 path
  prefix. No StatusPage, Deprecation or ChangeLog pointer is emitted.
