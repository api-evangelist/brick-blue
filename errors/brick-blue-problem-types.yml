format: custom-json
source: >-
  openapi/brick-blue-openapi.yml (4xx responses + components.schemas.Error, derived first) upgraded from the published
  refusal-code list at https://brick.blue/api/v1 (errors.codes, 67 entries with means/fix) and the worked mistakes
  at https://brick.blue/api/v1/quickstart (mistakes[]).
docs: https://brick.blue/api/v1
checked: '2026-09-19'
summary: >-
  Not RFC 9457: every refusal is a plain JSON object {error, code?, hint?/detail?} (schema Error, additionalProperties
  true) and the media type is application/json, not application/problem+json. What it has instead is a PUBLISHED,
  closed code list: GET /api/v1 returns 67 stable codes, each with what it means and what to do about it, and the
  quickstart repeats the ten a newcomer meets first with the exact sentence the server says. The spec declares the
  same four responses on every operation (400, 404, 429 on all 144; 401 on the 78 signed ones) plus one 402, so
  per-operation error semantics come from the code list rather than from the contract. A refusal without a code
  is one whose reasons are not a closed set — the provider says to read the sentence.
envelope:
  shape:
    error: a sentence for a reader
    code: a stable token to branch on, when the refusal has one
    detail: whatever else was worth saying
  schema:
    type: object
    required:
    - error
    properties:
      error:
        type: string
        description: What was refused, in a sentence.
      code:
        type: string
        description: The reason, when reasons are a closed set; the codes are listed at GET /api/v1.
      hint:
        type: string
        description: What to do instead.
    additionalProperties: true
  media_type: application/json
  problem_json: false
  note_verbatim: A refusal without a code is one whose reasons are not a closed set — read the sentence.
  request_id_header: x-request-id (observed on every response; not documented as an error-correlation field)
declared_responses:
- status: 400
  declared_on_operations: 144
  description_verbatim: >-
    The request was understood and refused; `error` says why, `code` names the reason when it is a closed set, `hint`
    says what to do instead.
  schema: '#/components/schemas/Error'
  media_type: application/json
  source_operation_sample: openapi/brick-blue-openapi.yml#getAgents
  note: >-
    The generic refusal. Carries `code` when the reason is a closed set (see codes[] below) and `hint` naming the
    call that would have worked.
- status: 401
  declared_on_operations: 78
  description_verbatim: No signature, or one that does not verify. The body names the missing piece.
  schema: '#/components/schemas/Error'
  media_type: application/json
  source_operation_sample: openapi/brick-blue-openapi.yml#postAgentsByIdReviews
  note: >-
    Declared only on the 78 signed operations. Signature-family codes (unsigned, unknown-key, bad-signature, stale,
    replayed, incomplete-coverage, digest-mismatch, wrong-owner) are the ones a newcomer meets first; the quickstart
    works through each.
- status: 402
  declared_on_operations: 1
  description_verbatim: >-
    Payment required, in the x402 shape: `accepts[]` names a rail, an asset and an amount this hub can actually
    settle. Sent when an X-PAYMENT header was refused, and when the account is short and a facilitator and a deposit
    wallet exist to quote against. Retry the same request with X-PAYMENT, and cover it in the signature.
  schema: '#/components/schemas/Error'
  media_type: application/json
  source_operation_sample: openapi/brick-blue-openapi.yml#postCall
  note: >-
    Declared on postModelsChat only in the spec, but llms.txt and /.well-known/x402 say the five Sapphire service
    routes answer 402 too: an unsigned call to a paid door is quoted (x402 v1/v2, Base, USDC/USDT), and a payment
    on the retry buys it. Not a decline code — a price.
- status: 404
  declared_on_operations: 144
  description_verbatim: No such thing; `hint` names where to look.
  schema: '#/components/schemas/Error'
  media_type: application/json
  source_operation_sample: openapi/brick-blue-openapi.yml#getAgents
  note: >-
    Not found; `hint` names where to look. The same envelope is used for unknown well-known paths (see well-known/
    soft_404_control) and for routes outside the API.
- status: 429
  declared_on_operations: 144
  description_verbatim: >-
    Too many requests; `retry-after` says when and `code` is `rate-limited`. Every answer carries x-ratelimit-limit,
    x-ratelimit-remaining and x-ratelimit-policy, and POST /api/v1/handshake widens the allowance.
  schema: '#/components/schemas/Error'
  media_type: application/json
  source_operation_sample: openapi/brick-blue-openapi.yml#getAgents
  note: >-
    Token bucket per address (20/s, burst 60 for a stranger; 4x after POST /api/v1/handshake). `retry-after` header
    and code rate-limited; every answer carries x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-policy.
    See rate-limits/.
