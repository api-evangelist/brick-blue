conformance:
  spec: A2A 1.0.0
  grade: flavored
  grade_basis: >-
    Two of the three hard checks pass — capabilities is an OBJECT ({streaming: true,
    pushNotifications: true, extendedAgentCard: false, extensions: [3]}) and skills is an ARRAY
    of 23 entries each carrying id, name, description and tags — but there is NO top-level
    protocolVersion, which the rubric treats as a hard failure. The protocol version ("1.0") is
    declared per interface inside supportedInterfaces[] instead, and there is no top-level `url`
    or `preferredTransport` either: the card relies entirely on supportedInterfaces[] to say
    where and how to reach the agent. A consumer written to the 1.0.0 top-level fields finds no
    endpoint; a consumer that reads supportedInterfaces[] finds two well-formed bindings. Graded
    against the rubric as written; the deviations below say exactly which fields move it.
  protocol_version: '1.0 (per interface, in supportedInterfaces[]; absent at top level)'
  preferred_transport: null
  interfaces:
    - {url: 'https://brick.blue/a2a', protocolBinding: JSONRPC, protocolVersion: '1.0'}
    - {url: 'https://brick.blue/api/v1', protocolBinding: HTTP+JSON, protocolVersion: '1.0'}
  deviations:
    - id: no-protocolVersion
      severity: hard
      detail: >-
        No top-level protocolVersion. Each supportedInterfaces[] entry carries protocolVersion
        "1.0", so the information exists, but not where a 1.0.0 consumer reads it.
    - id: no-url
      severity: hard-adjacent
      detail: >-
        No top-level `url`. The endpoints live only in supportedInterfaces[]. A strict consumer
        that requires `url` cannot locate the agent from this card.
    - id: supportedInterfaces-instead-of-additionalInterfaces
      severity: soft
      detail: >-
        Uses supportedInterfaces[] (two entries) rather than the 1.0.0 additionalInterfaces[] key.
        Both entries are well formed (url, protocolBinding, protocolVersion).
    - id: no-preferredTransport
      severity: soft
      detail: 'preferredTransport is absent; the JSONRPC interface is listed first, which is the only ordering signal.'
    - id: non-standard-top-level-keys
      severity: soft
      detail: >-
        `orientation` ({whatThisIs, whoYouAre}) is a provider-invented block naming the two A2A
        orientation methods (hub/get-started, hub/handshake). Useful, not namespaced as an extension.
    - id: non-standard-securityScheme-type
      severity: soft
      detail: >-
        securitySchemes.httpMessageSignatures has type "httpMessageSignature" (RFC 9421 over
        @method, @path, @query and content-digest, ed25519), which is not one of the A2A 1.0.0
        security scheme types. It is the same scheme the OpenAPI declares as `httpsig` (http,
        scheme signature). No top-level `security` requirement is declared.
  extensions_declared:
    - uri: https://modelcontextprotocol.io/
      required: false
      summary: 'MCP server for the same capabilities at https://brick.blue/mcp (verified live — see mcp/).'
    - uri: https://x402.org/
      required: false
      summary: 'x402 v1 and v2, role client and server, network eip155:8453 (Base), scheme exact, assets USDC and USDT; answers 402 on POST /api/v1/call.'
    - uri: https://www.rfc-editor.org/rfc/rfc9421
      required: false
      summary: 'HTTP Message Signatures required on every mutation; ed25519; cover minimum @method, @path, @query, content-digest, x-payment; parameters created, keyid, nonce.'
  method_surface_note: >-
    The GRADE is about the card's shape. The JSON-RPC door behind it was exercised anonymously
    on 2026-09-19: POST https://brick.blue/a2a {"method":"hub/get-started"} answered HTTP 200 with
    a 9,723-byte JSON-RPC result (the nine-path orientation the card's `orientation` block names),
    so the endpoint is live and the provider-specific orientation methods route. Standard A2A
    methods (message/send, tasks/get) were not exercised because every mutation requires an RFC
    9421 signature and message/send is how work is placed; the door's own GET description gives
    message/send as the starter call. Streaming and push notifications are claimed by the card and
    corroborated by the REST surface (GET /api/v1/me/inbox/stream is SSE; POST /api/v1/me/webhooks
    registers signed deliveries) — not verified over A2A itself.
