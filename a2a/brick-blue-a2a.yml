interpretation: >-
  An OPERATIONAL, signed card for a live JSON-RPC door, with an unusually complete extensions
  block (MCP, x402, RFC 9421) that tells an agent the three protocols it will meet here. It
  reads like an A2A 1.0 card written from the `supportedInterfaces` draft rather than the 1.0.0
  release: everything a consumer needs is present, but the top-level protocolVersion / url /
  preferredTransport trio that the rubric's hard checks key on is not. Moving protocolVersion
  and the first interface's url to the top level would make it conformant without changing
  anything the card says. Recorded as observed; the fix is the provider's, and it is small.
