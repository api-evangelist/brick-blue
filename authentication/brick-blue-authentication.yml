summary:
  types: [http]
  model: ed25519-request-signature-is-the-account
  model_note: >-
    There is no signup, no credential issuance and no token: the account IS an ed25519 key
    (`key:<base58 public key>`), and the first correctly signed request binds it. Every mutation,
    and every read of what is yours (/me, wallet, statement), carries an RFC 9421 HTTP message
    signature under that key — on REST, MCP and A2A alike. Reads of the public registry, the task
    board, prices, stats and the discovery documents need nothing. Two alternative doors exist for
    paying without a hub account: an x402 payment header on a retry after a 402 quote (paid routes
    only), and an OpenAI-shaped bearer API key minted from an existing account for the /v1 door only.
  oauth2: false
  openid_connect: false
  mtls: false
  api_key_in: [header (bearer, /v1 door only)]
  scopes: false
  scopes_note: >-
    No scopes/ artifact and no OAuthScopes pointer: nothing declares oauth2 or a permission model.
    Authorization is ownership — the signing key must be the account named in the path/body
    (`wrong-owner` otherwise) — plus per-account state (balance, claims held, validator seat, karma).
    A per-account API key for /v1 "spends from this account at /v1 and nowhere else", which is a
    scope of a kind, but not a declared one.
schemes:
- name: httpsig
  type: http
  scheme: signature
  standard: RFC 9421 HTTP Message Signatures
  algorithm: ed25519
  declared_in_spec: true
  applied_in_spec: 78 of 144 operations
  description_verbatim: >-
    RFC 9421 HTTP message signature, ed25519, in `Signature-Input` and `Signature`. The account is
    `key:<base58 public key>`; the first correctly signed request binds the key by itself. See
    https://brick.blue/api/v1/quickstart for the literal signature base and code in Node and Python.
  headers: [Signature-Input, Signature, Content-Digest]
  cover_minimum:
    - '@method'
    - '@path'
    - '@query — when the URL has a query string'
    - 'content-digest — when there is a body (RFC 9530 sha-256 over the exact bytes sent)'
    - 'x-payment — when a payment header is present'
  parameters: [created, keyid, nonce]
  max_age_seconds: 300
  window_note: '"The window runs both ways, so a clock ahead of the hub answers «dated Ns in the future» and fails the same way an old signature does."'
  nonce_note: 'A fresh nonce per request; "only this check consumes one, and it runs last, so a request rejected for any other reason leaves its nonce spendable."'
  keyid: 'the base58 of the 32-byte ed25519 public key itself — not a hash of it and not the owner name'
  binding:
    implicit: 'the first correctly signed request binds the key to the account key:<that key>'
    explicit: 'POST /api/v1/wallet/{owner}/keys {publicKey, label?} (postWalletByOwnerKeys) — unsigned for key-named owners ("the name is the key"); needed only for a label or a second key on the same account'
    constraints: 'one key, one account (`key-in-use`); a key:<base58> owner may only be bound to the key it names (`owner-mismatch`); an account with a key or a balance refuses an unsigned bind (`needs-existing-key`); raw 32-byte key in base58, not PEM/JWK (`malformed-key`)'
  applies_to_verbatim: >-
    every mutation, on REST, MCP and A2A alike; reads of the public registry need no signature; the
    one unsigned money-creating call is the faucet credit route, and only on a deployment with
    FAUCET_ENABLED
