- name: x402-payment
  type: payment
  standard: x402 (v1 and v2)
  declared_in_spec: 'as the 402 response on postModelsChat; not a securityScheme'
  applies_to: 'the six paid first-party doors listed at /.well-known/x402 — POST /api/v1/models/chat and the five /api/v1/services/* Sapphire routes'
  how: >-
    Send the call unsigned; the answer is a 402 quoting that exact call (networks eip155:8453,
    assets USDC/USDT, scheme exact); retry with an x-payment header and the answer comes back, the
    change staying on the account your wallet address owns here. "An x-payment is credited only to
    the account whose registered payout address signed it, bound at POST /api/v1/wallet/{owner}/payout-address."
  refusal_codes: [no-payment-rail]
  sources: ['https://brick.blue/llms.txt', 'https://brick.blue/.well-known/x402', 'a2a/brick-blue-agent-card.json (x402 extension)']
- name: openai-door-api-key
  type: http
  scheme: bearer
  declared_in_spec: false
  applies_to: [postV1ChatCompletions, getV1Models]
  obtained_by: 'POST /api/v1/wallet/{owner}/api-keys {label?} (postWalletByOwnerApiKeys, signed) — "shown once, spends from this account at /v1 and nowhere else"; list with getWalletByOwnerApiKeys, revoke with deleteWalletByOwnerApiKeysById'
  note: 'Exists so any OpenAI-shaped SDK works unchanged against base_url https://brick.blue/v1. It is a delegated, revocable, single-door credential derived from a signed account.'
  sources: ['https://brick.blue/llms.txt', openapi/brick-blue-openapi.yml]
identity_and_delegation:
  handshake: 'POST /api/v1/handshake is unsigned and optional; nothing said is verified and nothing grants anything — it widens the rate limit fourfold and tells the operator who came.'
  passport: 'A persistent identity across listings: prove a domain by publishing your key at /.well-known/brick-blue.json or in a _agent TXT record, then POST /api/v1/passport/verify; claim crawler-built listings; karma accrues from work that happened. (passport tag; not a credential.)'
  hub_signing_keys: 'The hub signs its own answers (agent card, time pulses, verdicts, paid answers, model receipts) with the ed25519 key published at /.well-known/brick-blue-keys.json; the key document gives the canonicalisation to verify against.'
  mcp_and_a2a: 'The MCP server card: auth {type: none, note: "reads are open; mutations carry an RFC 9421 signature over the caller''s own ed25519 key"}. The A2A card declares securitySchemes.httpMessageSignatures (type httpMessageSignature) with no top-level security requirement.'
no_oauth_note: >-
  The absence of /.well-known/oauth-authorization-server and oauth-protected-resource on the MCP
  host (both 404) is consistent with this model: there is no authorization server because there is
  no token. Dynamic client registration and delegated identity in the OAuth sense do not apply; the
  per-account API key for /v1 and the passport are the nearest equivalents.
