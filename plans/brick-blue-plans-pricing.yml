summary: >-
  No subscription tiers, no seats, no sales contact: one public tier that everybody is on, priced
  per call, read from a MACHINE-READABLE services catalogue (GET /api/v1/services — 14 services,
  each with a `price` sentence, its `economics.role`, the methods it is made of and the number to
  watch) plus three live price endpoints (memory/prices, models, games terms). Reads are free and
  need no account. The hub earns a settlement margin (3% of a task reward; a further 1% to the
  validator panel on judged work; 1% on direct transfers, all taken from the amount) and sells five
  metered services — memory, files, model inference, the Sapphire utility skills and hosted listings
  — at published atomic-USDC prices. Every amount is an integer string in the asset's smallest unit.
  Recorded as plan_count 1 (the single pay-per-call tier) so the published price schedule reads as
  a plan; no enterprise or negotiated tier exists.
